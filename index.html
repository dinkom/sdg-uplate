<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SDG Alati</title>
<meta name="theme-color" content="#1c1f17">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="common.css">
<style>
body{padding-bottom:calc(24px + env(safe-area-inset-bottom))}
.tiles{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;margin-top:10px}
a.tile{display:flex;gap:14px;align-items:center;text-decoration:none;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
a.tile:active{transform:scale(.98)}
.ico{width:52px;height:52px;flex:0 0 52px;border-radius:14px;background:var(--gold);color:#1c1f17;display:grid;place-items:center}
.ico svg{width:28px;height:28px}
.tile .t{flex:1;min-width:0}
.tile .t b{display:block;font-size:17px}
.tile .t span{color:var(--muted);font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .badge{display:block;margin-top:4px;font-weight:700;color:var(--gold);font-size:14px}
.tile .badge:empty{display:none}
.tile .badge small{color:var(--muted);font-weight:400;font-size:13px;margin-left:4px}
.arrow{color:var(--muted);font-size:22px}
</style>
</head>
<body>
<header>
  <h1><b>SDG</b> Alati</h1>
  <small id="today"></small>
</header>

<main>
  <div class="tiles" id="tiles"></div>

  <h2>Sigurnosna kopija</h2>
  <div class="card">
    <div class="hint" style="margin-top:0">Jedna datoteka s podacima svih modula. Podaci postoje samo na ovom mobitelu, zato je povremeno spremi na Drive ili pošalji sebi.</div>
    <div class="btns"><button class="primary" id="backupAll">Izvezi kopiju svega</button><button class="ghost" id="restoreAllBtn">Uvezi</button></div>
    <input type="file" id="restoreAll" accept="application/json,.json" hidden>
    <div class="hint" id="lastBackup"></div>
  </div>
  <div class="hint" style="text-align:center;margin:18px 0" id="ver"></div>
</main>

<div class="toast" id="toast"></div>

<script>
const VERSION = '1.2';
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2, '0');
const dayKey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const eur = n => (n ?? 0).toLocaleString('hr-HR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const read = k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };

// ---------- popis modula ----------
// Novi modul: napravi mapu (npr. "evidencija/") s index.html i dodaj ga ovdje.
// key = ključ pod kojim modul sprema podatke (ide u zajedničku kopiju)
// badge = kratki sažetak koji se vidi na pločici (nije obavezan)
const MODULES = [
  {
    id: 'uplate', href: 'uplate/', title: 'Uplate', desc: 'Članarine za fiskalizaciju',
    key: 'sdg-uplate-v1',
    icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 6.5A7 7 0 1 0 17.5 17.5"/><path d="M4 10h9M4 14h9"/></svg>',
    badge() {
      const d = read(this.key); if (!d || !d.entries) return '';
      const tk = dayKey(new Date());
      const open = d.entries.filter(e => !e.fisk);
      const today = open.filter(e => dayKey(new Date(e.ts)) === tk).reduce((s, e) => s + e.amount, 0);
      const older = open.filter(e => dayKey(new Date(e.ts)) < tk).length;
      if (!open.length) return '';
      return `${eur(today)}<small>za fiskalizirati${older ? ` · +${older} od prije` : ''}</small>`;
    }
  },
  {
    id: 'privatni', href: 'privatni/', title: 'Privatni', desc: 'Privatni treninzi i paketi',
    key: 'sdg-privatni-v1',
    icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="7" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><path d="M16 4.5l1.5 1.5L21 2.5" /><path d="M17 11h4M19 9v4"/></svg>',
    badge() {
      const d = read(this.key); if (!d || !d.sessions) return '';
      const tk = dayKey(new Date());
      const today = d.sessions.filter(s => !s.cancelled && dayKey(new Date(s.ts)) === tk).length;
      return today ? `${today}<small>${today === 1 ? 'trening danas' : 'treninga danas'}</small>` : '';
    }
  },
];

function render() {
  const now = new Date();
  $('#today').textContent = `${now.getDate()}. ${now.getMonth() + 1}. ${now.getFullYear()}.`;
  $('#tiles').innerHTML = MODULES.map(m => `
    <a class="tile" href="${m.href}">
      <div class="ico">${m.icon}</div>
      <div class="t"><b>${esc(m.title)}</b><span>${esc(m.desc)}</span>${m.badge ? `<div class="badge">${m.badge() || ''}</div>` : ''}</div>
      <div class="arrow">›</div>
    </a>`).join('');
  const meta = read('sdg-alati-meta') || {};
  $('#lastBackup').textContent = meta.lastBackup ? 'Zadnja kopija: ' + new Date(meta.lastBackup).toLocaleString('hr-HR') : 'Kopija još nije napravljena.';
  $('#ver').textContent = `SDG Alati v${VERSION}`;
}

// ---------- zajednička kopija ----------
async function share(filename, content, type) {
  const blob = new Blob([content], { type });
  const file = new File([blob], filename, { type });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: filename }); return; } catch (e) { if (e.name === 'AbortError') return; }
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
$('#backupAll').onclick = async () => {
  const modules = {};
  MODULES.forEach(m => { const d = read(m.key); if (d) modules[m.key] = d; });
  const meta = read('sdg-alati-meta') || {}; meta.lastBackup = new Date().toISOString();
  try { localStorage.setItem('sdg-alati-meta', JSON.stringify(meta)); } catch (e) {}
  await share(`sdg-alati-kopija-${dayKey(new Date())}.json`, JSON.stringify({ app: 'SDG Alati', created: meta.lastBackup, modules }, null, 1), 'application/json');
  render();
};

// uvoz: dodaje ono što nedostaje (spaja po id-u), postojeće ne dira i ništa ne briše
$('#restoreAllBtn').onclick = () => $('#restoreAll').click();
$('#restoreAll').onchange = async ev => {
  const f = ev.target.files[0]; if (!f) return;
  try {
    const b = JSON.parse(await f.text());
    if (!b || !b.modules) throw 0;
    let added = 0;
    for (const [key, incoming] of Object.entries(b.modules)) {
      if (!key.startsWith('sdg-')) continue;
      const local = read(key);
      if (!local) { localStorage.setItem(key, JSON.stringify(incoming)); added += Object.values(incoming).filter(Array.isArray).reduce((a, x) => a + x.length, 0); continue; }
      for (const [field, val] of Object.entries(incoming)) {
        if (!Array.isArray(val)) continue;
        if (!Array.isArray(local[field])) { local[field] = val; added += val.length; continue; }
        if (val.every(x => typeof x !== 'object')) { val.forEach(x => { if (!local[field].includes(x)) local[field].push(x); }); continue; }
        const ids = new Set(local[field].map(x => x && x.id));
        val.forEach(x => { if (x && x.id && !ids.has(x.id)) { local[field].push(x); added++; } });
      }
      localStorage.setItem(key, JSON.stringify(local));
    }
    toast(`Uvezeno ${added} novih zapisa`); render();
  } catch (e) { toast('Neispravna datoteka'); }
  ev.target.value = '';
};

let tt;
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 2400); }
addEventListener('pageshow', render);
document.addEventListener('visibilitychange', () => { if (!document.hidden) render(); });
render();
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
