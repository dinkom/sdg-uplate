<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Privatni · SDG Alati</title>
<meta name="theme-color" content="#1c1f17">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icon-192.png">
<link rel="apple-touch-icon" href="../icon-192.png">
<link rel="stylesheet" href="../common.css">
<style>
main{padding-bottom:70px}
.search{margin:6px 0 4px}
ul.list li.cl{cursor:pointer}
.who b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who span{color:var(--muted);font-size:13px;display:block}
.who{flex:1;min-width:0}
.tag{font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap;background:var(--card2);color:var(--muted)}
.tag.ok{background:#7fb06926;color:var(--ok)}
.tag.warn{background:#e3b23c26;color:var(--gold)}
.tag.bad{background:#d9634c2e;color:var(--bad)}
.fab{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;background:var(--gold);color:#1c1f17;font-size:32px;line-height:1;padding:0;box-shadow:0 6px 18px #0008;display:grid;place-items:center}
.bar{height:10px;border-radius:99px;background:var(--card2);overflow:hidden;display:flex;margin:8px 0 4px}
.bar i{display:block;height:100%}
.bar i.u{background:var(--gold)}
.bar i.p{background:repeating-linear-gradient(45deg,var(--gold) 0 4px,#e3b23c55 4px 8px)}
.pkhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.pkhead b{font-size:17px}
.sess{padding:12px 2px;border-top:1px solid var(--line);cursor:pointer}
.sess:first-child{border-top:0}
.sess .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sess .when{font-weight:700}
.sess .when small{color:var(--muted);font-weight:400}
.sess .nt{color:var(--muted);font-size:14px;margin-top:4px;white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.sess.future .when{color:var(--gold)}
.sess.cancel .when{text-decoration:line-through;color:var(--muted)}
.prev{background:var(--card2);border-left:3px solid var(--gold);border-radius:8px;padding:10px 12px;margin:10px 0 2px;font-size:14px;white-space:pre-wrap;max-height:160px;overflow:auto}
.prev small{display:block;color:var(--muted);margin-bottom:4px}
textarea.notes{min-height:150px}
.dict{display:flex;gap:8px;align-items:center;margin-top:6px}
.dict button{padding:8px 12px;font-size:14px}
.dict button.on{background:var(--bad);color:#fff}
.seg{display:flex;gap:8px}
.seg button{flex:1;border:1px solid var(--line);background:transparent}
.seg button.on{background:var(--gold);color:#1c1f17;border-color:var(--gold);font-weight:700}
.daylbl{font-size:13px;color:var(--gold);margin:14px 2px 0;font-weight:600}
.lastnote{font-size:14px;white-space:pre-wrap;color:var(--text)}
dialog{max-height:92vh;overflow:auto}
.chkrow{display:flex;gap:8px;align-items:center;font-size:15px;margin-top:4px}
.chkrow input{width:22px;height:22px}
</style>
</head>
<body>
<header>
  <div class="ttl"><a class="back" href="../" id="back" aria-label="Natrag">‹</a><h1 id="htitle"><b>SDG</b> Privatni</h1></div>
  <small id="hsub"></small>
</header>

<main>
  <!-- POLAZNICI -->
  <section class="view on" id="v-list">
    <input class="search" id="q" placeholder="Traži polaznika…" autocomplete="off">
    <div class="card"><ul class="list" id="clients"></ul></div>
  </section>

  <!-- JEDAN POLAZNIK -->
  <section class="view" id="v-client">
    <div class="card" id="pkCard"></div>
    <div class="card" id="lastCard" hidden></div>
    <h2>Treninzi</h2>
    <div class="card"><div id="sessList"></div></div>
    <h2>Paketi</h2>
    <div class="card"><div id="pkList"></div>
      <div class="btns"><button class="ghost" id="addPk">+ Novi paket</button></div>
    </div>
    <div class="btns" style="margin:16px 0 30px"><button class="ghost" id="editClient">Uredi polaznika</button></div>
  </section>

  <!-- RASPORED -->
  <section class="view" id="v-sched">
    <h2>Nadolazeći</h2>
    <div class="card"><div id="upcoming"></div></div>
    <h2>Zadnjih 14 dana</h2>
    <div class="card"><div id="recent"></div></div>
  </section>
</main>

<button class="fab" id="fab" aria-label="Dodaj">+</button>

<nav>
  <button class="on" data-v="list">Polaznici</button>
  <button data-v="sched">Raspored</button>
</nav>

<!-- dijalog: polaznik -->
<dialog id="dClient">
  <h3 style="margin:0 0 10px" id="dClientT">Novi polaznik</h3>
  <div class="grid3">
    <div><label>Ime i prezime</label><input id="c-name" autocomplete="off"></div>
    <div><label>Telefon (nije obavezno)</label><input id="c-phone" type="tel" autocomplete="off"></div>
    <div><label>Napomena (ciljevi, sport…)</label><textarea id="c-note" rows="3"></textarea></div>
  </div>
  <div id="c-newpk">
    <label style="margin-top:12px">Paket</label>
    <div class="seg" id="c-seg">
      <button data-s="0" class="on">Bez paketa</button><button data-s="1">Single</button><button data-s="10">10 treninga</button>
    </div>
  </div>
  <div class="btns">
    <button class="danger" id="c-del" hidden>Obriši</button>
    <button class="ghost" id="c-close">Zatvori</button>
    <button class="primary" id="c-save">Spremi</button>
  </div>
</dialog>

<!-- dijalog: paket -->
<dialog id="dPk">
  <h3 style="margin:0 0 10px" id="dPkT">Novi paket</h3>
  <div class="seg" id="p-seg"><button data-s="1">Single</button><button data-s="10" class="on">10 treninga</button></div>
  <div class="grid3">
    <div><label>Datum kupnje</label><input id="p-date" type="date"></div>
    <div><label>Napomena (nije obavezno)</label><input id="p-note" autocomplete="off"></div>
  </div>
  <div class="hint">Treninzi se raspoređuju po paketima redom, od najstarijeg paketa prema novijem.</div>
  <div class="btns">
    <button class="danger" id="p-del" hidden>Obriši</button>
    <button class="ghost" id="p-close">Zatvori</button>
    <button class="primary" id="p-save">Spremi</button>
  </div>
</dialog>

<!-- dijalog: trening -->
<dialog id="dSess">
  <h3 style="margin:0 0 10px" id="dSessT">Trening</h3>
  <div class="grid3">
    <div><label>Polaznik</label><select id="s-client"></select></div>
    <div class="row">
      <div style="flex:1.3"><label>Datum</label><input id="s-date" type="date"></div>
      <div style="flex:1"><label>Sat</label><input id="s-time" type="time" step="300"></div>
    </div>
  </div>
  <div id="s-prev"></div>
  <label style="margin-top:12px">Što ste radili / plan</label>
  <textarea id="s-notes" class="notes" placeholder="npr. guard pass – knee slice, armbar iz guarda; čučanj 4×8 60 kg, iskoraci…"></textarea>
  <div class="dict"><button class="ghost" id="s-mic">🎤 Diktiraj</button><span class="hint" style="margin:0" id="s-micHint"></span></div>
  <label class="chkrow"><input type="checkbox" id="s-cancel"> Otkazan (ne troši paket)</label>
  <div class="btns">
    <button class="danger" id="s-del" hidden>Obriši</button>
    <button class="ghost" id="s-close">Zatvori</button>
    <button class="primary" id="s-save">Spremi</button>
  </div>
</dialog>

<div class="toast" id="toast"></div>

<script>
const VERSION = '1.0';
const KEY = 'sdg-privatni-v1';
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2, '0');
const dayKey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const hm = d => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
const DAN = ['ned', 'pon', 'uto', 'sri', 'čet', 'pet', 'sub'];
const fmtD = d => `${DAN[d.getDay()]} ${d.getDate()}.${d.getMonth() + 1}.${d.getFullYear() !== new Date().getFullYear() ? d.getFullYear() + '.' : ''}`;
const fmtDate = iso => { const d = new Date(iso); return `${d.getDate()}.${d.getMonth() + 1}.${d.getFullYear()}.`; };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const pkName = p => p.size === 1 ? 'Single' : `Paket ${p.size}`;

// ---------- podaci ----------
// clients: {id,name,phone,note}  packages: {id,clientId,size,bought(yyyy-mm-dd),note}
// sessions: {id,clientId,ts(ISO),notes,cancelled}
let db = load();
function load() {
  try { const d = JSON.parse(localStorage.getItem(KEY)); if (d && Array.isArray(d.clients)) return { clients: d.clients, packages: d.packages || [], sessions: d.sessions || [] }; } catch (e) {}
  return { clients: [], packages: [], sessions: [] };
}
function persist() { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) { toast('Greška pri spremanju!'); } }
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

// Raspodjela treninga po paketima: kronološki, najstariji paket prvi.
function alloc(clientId) {
  const now = Date.now();
  const pks = db.packages.filter(p => p.clientId === clientId).sort((a, b) => a.bought < b.bought ? -1 : a.bought > b.bought ? 1 : 0);
  const ss = db.sessions.filter(s => s.clientId === clientId).sort((a, b) => a.ts < b.ts ? -1 : 1);
  const stat = pks.map(p => ({ p, used: 0, planned: 0, n: 0 }));
  const bySess = {};
  let pi = 0, unpaid = 0;
  for (const s of ss) {
    if (s.cancelled) { bySess[s.id] = null; continue; }
    while (pi < stat.length && stat[pi].n >= stat[pi].p.size) pi++;
    if (pi < stat.length) {
      const st = stat[pi]; st.n++;
      new Date(s.ts).getTime() <= now ? st.used++ : st.planned++;
      bySess[s.id] = { pk: st.p, n: st.n };
    } else { bySess[s.id] = 'unpaid'; unpaid++; }
  }
  const remaining = stat.reduce((a, st) => a + (st.p.size - st.n), 0);
  const active = stat.find(st => st.n < st.p.size) || stat[stat.length - 1] || null;
  const future = ss.filter(s => !s.cancelled && new Date(s.ts).getTime() > now);
  const past = ss.filter(s => new Date(s.ts).getTime() <= now && !s.cancelled);
  return { stat, bySess, unpaid, remaining, active, next: future[0] || null, last: past[past.length - 1] || null, sessions: ss };
}
function statusTag(a) {
  if (a.unpaid) return `<span class="tag bad">${a.unpaid} bez paketa</span>`;
  if (!a.stat.length) return `<span class="tag">nema paketa</span>`;
  if (a.remaining === 0) return `<span class="tag bad">potrošen</span>`;
  if (a.remaining <= 2) return `<span class="tag warn">još ${a.remaining}</span>`;
  return `<span class="tag ok">još ${a.remaining}</span>`;
}
function sessTag(x) {
  if (x === null) return '<span class="tag">otkazan</span>';
  if (x === 'unpaid') return '<span class="tag bad">bez paketa</span>';
  return `<span class="tag">${x.pk.size === 1 ? 'Single' : x.n + '/' + x.pk.size}</span>`;
}

// ---------- navigacija (hash => Android "natrag" radi) ----------
let view = 'list', curClient = null;
function route() {
  const h = location.hash.slice(1);
  if (h.startsWith('c=')) { curClient = h.slice(2); view = db.clients.some(c => c.id === curClient) ? 'client' : 'list'; }
  else view = h === 'sched' ? 'sched' : 'list';
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('on', v.id === 'v-' + view));
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.v === (view === 'client' ? 'list' : view)));
  render(); scrollTo(0, 0);
}
addEventListener('hashchange', route);
document.querySelectorAll('nav button').forEach(b => b.onclick = () => { location.hash = b.dataset.v === 'list' ? '' : b.dataset.v; });
$('#back').onclick = e => { if (view === 'client') { e.preventDefault(); history.length > 1 ? history.back() : (location.hash = ''); } };

// ---------- prikaz ----------
function sessRow(s, x, showName) {
  const d = new Date(s.ts), fut = d.getTime() > Date.now();
  const c = showName ? db.clients.find(c => c.id === s.clientId) : null;
  return `<div class="sess ${fut ? 'future' : ''} ${s.cancelled ? 'cancel' : ''}" data-sess="${s.id}">
    <div class="top"><div class="when">${showName ? esc(c ? c.name : '?') + ' <small>· ' + hm(d) + '</small>' : fmtD(d) + ' <small>' + hm(d) + (fut ? ' · zakazano' : '') + '</small>'}</div>${sessTag(x)}</div>
    ${s.notes ? `<div class="nt">${esc(s.notes)}</div>` : ''}</div>`;
}

function render() {
  $('#back').setAttribute('href', view === 'client' ? '#' : '../');
  const q = $('#q').value.trim().toLowerCase();
  if (view === 'list') {
    $('#htitle').innerHTML = '<b>SDG</b> Privatni'; $('#hsub').textContent = `${db.clients.length} polaznika`;
    const rows = db.clients.filter(c => !q || c.name.toLowerCase().includes(q)).map(c => ({ c, a: alloc(c.id) }))
      .sort((x, y) => (x.a.next ? 0 : 1) - (y.a.next ? 0 : 1) || (x.a.next && y.a.next ? (x.a.next.ts < y.a.next.ts ? -1 : 1) : 0) || x.c.name.localeCompare(y.c.name, 'hr'));
    $('#clients').innerHTML = rows.length ? rows.map(({ c, a }) => {
      const nx = a.next ? new Date(a.next.ts) : null, ls = a.last ? new Date(a.last.ts) : null;
      const sub = nx ? `Sljedeći: ${fmtD(nx)} ${hm(nx)}` : ls ? `Zadnji: ${fmtD(ls)}` : 'Još nema treninga';
      return `<li class="cl" data-client="${c.id}"><div class="who"><b>${esc(c.name)}</b><span>${sub}</span></div>${statusTag(a)}</li>`;
    }).join('') : `<div class="empty">${db.clients.length ? 'Nema rezultata.' : 'Dodaj prvog polaznika gumbom +'}</div>`;
  }
  if (view === 'client') {
    const c = db.clients.find(c => c.id === curClient); if (!c) return;
    const a = alloc(c.id);
    $('#htitle').textContent = c.name; $('#hsub').textContent = '';
    // aktivni paket
    if (a.active) {
      const st = a.active, sz = st.p.size;
      $('#pkCard').innerHTML = `<div class="pkhead"><b>${pkName(st.p)}</b>${statusTag(a)}</div>
        <div class="bar"><i class="u" style="width:${st.used / sz * 100}%"></i><i class="p" style="width:${st.planned / sz * 100}%"></i></div>
        <div class="hint" style="margin:0">Iskorišteno ${st.used}/${sz}${st.planned ? ` · zakazano ${st.planned}` : ''} · kupljen ${fmtDate(st.p.bought)}${a.remaining > sz - st.n ? ` · ukupno preostalo ${a.remaining}` : ''}</div>
        ${a.unpaid ? `<div class="hint" style="color:var(--bad)">${a.unpaid} ${a.unpaid === 1 ? 'trening nije' : 'treninga nije'} pokriveno paketom — dodaj novi paket.</div>` : ''}
        ${c.note ? `<div class="hint">${esc(c.note)}</div>` : ''}${c.phone ? `<div class="hint"><a href="tel:${esc(c.phone)}">${esc(c.phone)}</a></div>` : ''}`;
    } else {
      $('#pkCard').innerHTML = `<div class="pkhead"><b>Nema paketa</b>${statusTag(a)}</div><div class="btns"><button class="primary" data-newpk="1">+ Dodaj paket</button></div>
        ${c.note ? `<div class="hint">${esc(c.note)}</div>` : ''}${c.phone ? `<div class="hint"><a href="tel:${esc(c.phone)}">${esc(c.phone)}</a></div>` : ''}`;
    }
    // zadnji trening
    const lastWithNotes = [...a.sessions].reverse().find(s => new Date(s.ts).getTime() <= Date.now() && !s.cancelled && s.notes);
    $('#lastCard').hidden = !lastWithNotes;
    if (lastWithNotes) $('#lastCard').innerHTML = `<div class="hint" style="margin:0 0 6px">Prošli put · ${fmtD(new Date(lastWithNotes.ts))}</div><div class="lastnote">${esc(lastWithNotes.notes)}</div>`;
    // treninzi: zakazani gore (najbliži prvi), zatim prošli (najnoviji prvi)
    const fut = a.sessions.filter(s => new Date(s.ts).getTime() > Date.now());
    const past = a.sessions.filter(s => new Date(s.ts).getTime() <= Date.now()).reverse();
    $('#sessList').innerHTML = (fut.length || past.length) ? [...fut, ...past].map(s => sessRow(s, a.bySess[s.id])).join('') : '<div class="empty">Još nema treninga. Dodaj ga gumbom +</div>';
    // paketi
    $('#pkList').innerHTML = a.stat.length ? [...a.stat].reverse().map(st => `<div class="sess" data-pk="${st.p.id}"><div class="top"><div class="when">${pkName(st.p)} <small>· ${fmtDate(st.p.bought)}</small></div><span class="tag ${st.n >= st.p.size ? '' : 'ok'}">${st.n}/${st.p.size}</span></div>${st.p.note ? `<div class="nt">${esc(st.p.note)}</div>` : ''}</div>`).join('') : '<div class="empty">Nema paketa.</div>';
  }
  if (view === 'sched') {
    $('#htitle').innerHTML = '<b>SDG</b> Privatni'; $('#hsub').textContent = 'Raspored';
    const now = Date.now(), from = now - 14 * 864e5;
    const allocs = {}; db.clients.forEach(c => allocs[c.id] = alloc(c.id).bySess);
    const xs = s => (allocs[s.clientId] || {})[s.id];
    const grp = (list) => {
      let out = '', lastDay = '';
      list.forEach(s => { const d = new Date(s.ts), k = dayKey(d);
        if (k !== lastDay) { out += `<div class="daylbl">${k === dayKey(new Date()) ? 'Danas' : fmtD(d)}</div>`; lastDay = k; }
        out += sessRow(s, xs(s), true); });
      return out;
    };
    const up = db.sessions.filter(s => new Date(s.ts).getTime() > now).sort((a, b) => a.ts < b.ts ? -1 : 1);
    const rec = db.sessions.filter(s => { const t = new Date(s.ts).getTime(); return t <= now && t >= from; }).sort((a, b) => a.ts < b.ts ? 1 : -1);
    $('#upcoming').innerHTML = up.length ? grp(up) : '<div class="empty">Nema zakazanih treninga.</div>';
    $('#recent').innerHTML = rec.length ? grp(rec) : '<div class="empty">Nema treninga u zadnjih 14 dana.</div>';
  }
}
$('#q').addEventListener('input', render);

document.addEventListener('click', ev => {
  const t = ev.target.closest('[data-client],[data-sess],[data-pk],[data-newpk]'); if (!t) return;
  if (t.dataset.client) location.hash = 'c=' + t.dataset.client;
  else if (t.dataset.sess) openSess(t.dataset.sess);
  else if (t.dataset.pk) openPk(t.dataset.pk);
  else if (t.dataset.newpk) openPk(null);
});
$('#fab').onclick = () => view === 'client' ? openSess(null, curClient) : view === 'sched' ? openSess(null, null) : openClient(null);

// ---------- polaznik ----------
let editClientId = null, newPkSize = 0;
function segInit(sel, val, cb) {
  document.querySelectorAll(sel + ' button').forEach(b => { b.classList.toggle('on', +b.dataset.s === val); b.onclick = () => { document.querySelectorAll(sel + ' button').forEach(x => x.classList.toggle('on', x === b)); cb(+b.dataset.s); }; });
}
function openClient(id) {
  editClientId = id; const c = db.clients.find(c => c.id === id) || {};
  $('#dClientT').textContent = id ? 'Uredi polaznika' : 'Novi polaznik';
  $('#c-name').value = c.name || ''; $('#c-phone').value = c.phone || ''; $('#c-note').value = c.note || '';
  $('#c-newpk').hidden = !!id; $('#c-del').hidden = !id;
  newPkSize = 0; segInit('#c-seg', 0, v => newPkSize = v);
  $('#dClient').showModal(); if (!id) $('#c-name').focus();
}
$('#editClient').onclick = () => openClient(curClient);
$('#c-close').onclick = () => $('#dClient').close();
$('#c-save').onclick = () => {
  const name = $('#c-name').value.trim(); if (!name) return toast('Upiši ime');
  if (editClientId) Object.assign(db.clients.find(c => c.id === editClientId), { name, phone: $('#c-phone').value.trim(), note: $('#c-note').value.trim() });
  else {
    const id = uid(); db.clients.push({ id, name, phone: $('#c-phone').value.trim(), note: $('#c-note').value.trim() });
    if (newPkSize) db.packages.push({ id: uid(), clientId: id, size: newPkSize, bought: dayKey(new Date()), note: '' });
    persist(); $('#dClient').close(); location.hash = 'c=' + id; return;
  }
  persist(); $('#dClient').close(); render();
};
armDelete('#c-del', () => {
  db.sessions = db.sessions.filter(s => s.clientId !== editClientId);
  db.packages = db.packages.filter(p => p.clientId !== editClientId);
  db.clients = db.clients.filter(c => c.id !== editClientId);
  persist(); $('#dClient').close(); location.hash = ''; toast('Polaznik obrisan');
});

// ---------- paket ----------
let editPkId = null, pkSize = 10;
function openPk(id) {
  editPkId = id; const p = db.packages.find(p => p.id === id);
  $('#dPkT').textContent = id ? 'Uredi paket' : 'Novi paket';
  pkSize = p ? p.size : 10; segInit('#p-seg', pkSize, v => pkSize = v);
  $('#p-date').value = p ? p.bought : dayKey(new Date()); $('#p-note').value = p ? p.note || '' : '';
  $('#p-del').hidden = !id; $('#dPk').showModal();
}
$('#addPk').onclick = () => openPk(null);
$('#p-close').onclick = () => $('#dPk').close();
$('#p-save').onclick = () => {
  const bought = $('#p-date').value || dayKey(new Date()), note = $('#p-note').value.trim();
  if (editPkId) Object.assign(db.packages.find(p => p.id === editPkId), { size: pkSize, bought, note });
  else db.packages.push({ id: uid(), clientId: curClient, size: pkSize, bought, note });
  persist(); $('#dPk').close(); render(); toast('Paket spremljen');
};
armDelete('#p-del', () => { db.packages = db.packages.filter(p => p.id !== editPkId); persist(); $('#dPk').close(); render(); toast('Paket obrisan'); });

// ---------- trening ----------
let editSessId = null;
function showPrev() {
  const cid = $('#s-client').value, cur = editSessId ? db.sessions.find(s => s.id === editSessId) : null;
  const before = cur ? cur.ts : new Date(`${$('#s-date').value}T${$('#s-time').value || '00:00'}`).toISOString();
  const prev = db.sessions.filter(s => s.clientId === cid && s.id !== editSessId && s.notes && !s.cancelled && s.ts < before).sort((a, b) => a.ts < b.ts ? 1 : -1)[0];
  $('#s-prev').innerHTML = prev ? `<div class="prev"><small>Prošli put · ${fmtD(new Date(prev.ts))}</small>${esc(prev.notes)}</div>` : '';
}
function openSess(id, clientId) {
  if (!db.clients.length) return toast('Prvo dodaj polaznika');
  editSessId = id; const s = db.sessions.find(s => s.id === id);
  $('#s-client').innerHTML = [...db.clients].sort((a, b) => a.name.localeCompare(b.name, 'hr')).map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join('');
  $('#s-client').value = s ? s.clientId : clientId || db.clients[0].id;
  const d = s ? new Date(s.ts) : new Date(); if (!s) d.setMinutes(0, 0, 0);
  $('#s-date').value = dayKey(d); $('#s-time').value = hm(d);
  $('#s-notes').value = s ? s.notes || '' : ''; $('#s-cancel').checked = !!(s && s.cancelled);
  $('#dSessT').textContent = s ? 'Trening' : 'Novi trening';
  $('#s-del').hidden = !id; showPrev(); $('#dSess').showModal();
}
['#s-client', '#s-date', '#s-time'].forEach(sel => $(sel).addEventListener('change', showPrev));
$('#s-close').onclick = () => { stopDict(); $('#dSess').close(); };
$('#s-save').onclick = () => {
  stopDict();
  if (!$('#s-date').value) return toast('Odaberi datum');
  const ts = new Date(`${$('#s-date').value}T${$('#s-time').value || '00:00'}`).toISOString();
  const data = { clientId: $('#s-client').value, ts, notes: $('#s-notes').value.trim(), cancelled: $('#s-cancel').checked };
  if (editSessId) Object.assign(db.sessions.find(s => s.id === editSessId), data);
  else db.sessions.push({ id: uid(), ...data });
  persist(); $('#dSess').close(); render();
  const a = alloc(data.clientId), x = a.bySess[editSessId || db.sessions[db.sessions.length - 1].id];
  toast(x === 'unpaid' ? 'Spremljeno — nema paketa za ovaj trening!' : x && x.pk ? `Spremljeno · ${x.pk.size === 1 ? 'Single' : x.n + '/' + x.pk.size}` : 'Spremljeno');
};
armDelete('#s-del', () => { db.sessions = db.sessions.filter(s => s.id !== editSessId); persist(); $('#dSess').close(); render(); toast('Trening obrisan'); });

// ---------- diktiranje bilješki ----------
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let dict = null, dictOn = false;
function stopDict() { if (dictOn && dict) { try { dict.stop(); } catch (e) {} } }
$('#s-mic').onclick = () => {
  if (!SR) return toast('Diktiranje nije podržano — koristi mikrofon na tipkovnici');
  if (dictOn) return stopDict();
  dict = new SR(); dict.lang = 'hr-HR'; dict.continuous = true; dict.interimResults = true;
  const ta = $('#s-notes'); const base = ta.value ? ta.value.replace(/\s*$/, '') + '\n' : '';
  let fin = '';
  dict.onstart = () => { dictOn = true; $('#s-mic').classList.add('on'); $('#s-mic').textContent = '■ Zaustavi'; $('#s-micHint').textContent = 'Slušam…'; };
  dict.onresult = e => { let int = ''; for (let i = e.resultIndex; i < e.results.length; i++) { if (e.results[i].isFinal) fin += e.results[i][0].transcript + ' '; else int += e.results[i][0].transcript; } ta.value = base + (fin + int).trim(); };
  dict.onerror = e => { if (e.error === 'not-allowed') toast('Dozvoli pristup mikrofonu'); else if (e.error === 'network') toast('Diktiranje treba internet'); };
  dict.onend = () => { dictOn = false; $('#s-mic').classList.remove('on'); $('#s-mic').textContent = '🎤 Diktiraj'; $('#s-micHint').textContent = ''; };
  dict.start();
};

// ---------- ostalo ----------
function armDelete(sel, fn) {
  let armed = false, t;
  $(sel).onclick = () => {
    if (!armed) { armed = true; $(sel).textContent = 'Sigurno?'; t = setTimeout(() => { armed = false; $(sel).textContent = 'Obriši'; }, 3000); return; }
    clearTimeout(t); armed = false; $(sel).textContent = 'Obriši'; fn();
  };
}
let tt;
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 2600); }
document.addEventListener('visibilitychange', () => { if (!document.hidden) render(); });
route();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('../sw.js', { scope: '../' }).catch(() => {});
</script>
</body>
